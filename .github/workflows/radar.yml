name: Generate Security Radar

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate radar
        run: node bin/secradar.js . examples/ci-radar.svg
      # Optional: commit the generated SVG on manual runs
